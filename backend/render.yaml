# Render.com deployment configuration for CreatorLoop backend
# Deploy at: https://render.com
# Documentation: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: creatorloop-api
    env: python
    region: oregon  # or: frankfurt, singapore, ohio

    # Build configuration
    buildCommand: |
      pip install -r requirements.txt &&
      alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    # Runtime
    plan: free  # upgrade to starter/standard for production

    # Health check
    healthCheckPath: /api/health

    # Environment variables
    # Set these in Render dashboard → Environment tab (never in this file)
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a secure value
      - key: DATABASE_URL
        fromDatabase:
          name: creatorloop-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CL_DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel frontend URL

  # PostgreSQL database (Render managed)
  # Free tier: 90-day retention; upgrade for persistence
  # databases:
  #   - name: creatorloop-db
  #     databaseName: creatorloop
  #     user: creatorloop
  #     plan: free
